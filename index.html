<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍣 ระบบหารค่าอาหาร Hamazushi (1,170 บาท)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .dish-img { object-fit: cover; aspect-ratio: 4/3; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-28 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🍣</span>
        <div>
          <h1 class="font-bold text-base md:text-lg leading-tight text-slate-900">หารค่าอาหาร Hamazushi</h1>
          <p class="text-xs text-slate-500">25 จาน • ยอดรวม 1,170 บาท</p>
        </div>
      </div>
      <div class="text-right">
        <span id="header-status-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="header-status-text">ยังเลือกไม่ครบ</span>
        </span>
      </div>
    </div>

    <!-- Live Bill Allocator Summary Bar -->
    <div class="max-w-3xl mx-auto px-4 pb-3">
      <div class="grid grid-cols-3 gap-2">
        <!-- Jai -->
        <div class="bg-indigo-50/80 border-2 border-indigo-200 rounded-xl p-2.5 text-center transition-all hover:shadow-sm">
          <div class="text-xs font-bold text-indigo-700 flex items-center justify-center gap-1">
            <span>👤 Jai</span>
            <span id="cnt-jai" class="text-[10px] px-1.5 py-0.2 rounded-full bg-indigo-200 text-indigo-800 font-semibold">0</span>
          </div>
          <div id="sum-jai" class="text-lg md:text-xl font-black text-indigo-900 mt-0.5">฿0</div>
        </div>

        <!-- Niki -->
        <div class="bg-emerald-50/80 border-2 border-emerald-200 rounded-xl p-2.5 text-center transition-all hover:shadow-sm">
          <div class="text-xs font-bold text-emerald-700 flex items-center justify-center gap-1">
            <span>👤 Niki</span>
            <span id="cnt-niki" class="text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-200 text-emerald-800 font-semibold">0</span>
          </div>
          <div id="sum-niki" class="text-lg md:text-xl font-black text-emerald-900 mt-0.5">฿0</div>
        </div>

        <!-- P'Kook -->
        <div class="bg-rose-50/80 border-2 border-rose-200 rounded-xl p-2.5 text-center transition-all hover:shadow-sm">
          <div class="text-xs font-bold text-rose-700 flex items-center justify-center gap-1">
            <span>👤 P'Kook</span>
            <span id="cnt-kook" class="text-[10px] px-1.5 py-0.2 rounded-full bg-rose-200 text-rose-800 font-semibold">0</span>
          </div>
          <div id="sum-kook" class="text-lg md:text-xl font-black text-rose-900 mt-0.5">฿0</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">

    <!-- Quick Action Controls & Filters -->
    <div class="flex flex-wrap items-center justify-between gap-2 bg-white border border-slate-200 rounded-xl p-3 shadow-xs text-xs">
      <div class="flex items-center gap-1.5 overflow-x-auto py-1 max-w-full">
        <button onclick="setFilter('all')" id="btn-filter-all" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-900 text-white">ทั้งหมด (25)</button>
        <button onclick="setFilter('unassigned')" id="btn-filter-unassigned" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">ยังไม่เลือก (<span id="unassigned-count">25</span>)</button>
        <button onclick="setFilter('30')" id="btn-filter-30" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">30฿</button>
        <button onclick="setFilter('40')" id="btn-filter-40" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">40฿</button>
        <button onclick="setFilter('60')" id="btn-filter-60" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">60฿</button>
        <button onclick="setFilter('80-100')" id="btn-filter-80-100" class="filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">80-100฿</button>
      </div>

      <div class="flex items-center gap-2 ml-auto">
        <button onclick="splitAllEqually()" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 font-medium hover:bg-blue-100 transition flex items-center gap-1">
          ⚡ หาร 3 เท่ากัน
        </button>
        <button onclick="resetAll()" class="px-2.5 py-1 rounded-lg border border-slate-200 text-slate-600 font-medium hover:bg-slate-100 transition">
          🔄 ล้างที่เลือก
        </button>
      </div>
    </div>

    <!-- Dish List Cards -->
    <div id="dishes-container" class="space-y-3">
      <!-- Rendered via JS -->
    </div>

  </main>

  <!-- Sticky Bottom Footer with Share Button -->
  <footer class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 py-3 px-4 shadow-lg">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div>
        <div class="text-xs text-slate-500">ยอดเงินที่เลือกแล้ว</div>
        <div class="flex items-baseline gap-1.5">
          <span id="footer-allocated" class="text-xl font-bold text-slate-900">฿0</span>
          <span class="text-xs text-slate-400">/ ฿1,170</span>
        </div>
      </div>

      <button onclick="copySummaryToLine()" class="flex-1 sm:flex-initial sm:min-w-[240px] px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm shadow-md transition flex items-center justify-center gap-2 active:scale-95">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.019 9.579.39.082.923.254 1.058.583.12.295.079.757.038 1.056l-.168 1.018c-.052.309-.247 1.21.996.66 1.242-.55 6.708-3.951 9.152-6.765 1.942-2.146 2.905-4.223 2.905-6.131z"/></svg>
        คัดลอกสรุปยอดส่ง LINE
      </button>
    </div>
  </footer>

    <span id="toast-msg">คัดลอกเรียบร้อยแล้ว</span>
  </div>

    // State: Array of { jai: bool, niki: bool, kook: bool }
    let state = [];
    const saved = localStorage.getItem('hamazushi_split_state');
    if (saved) {
      try { state = JSON.parse(saved); } catch(e) { state = []; }
    }
    if (!state || state.length !== dishesData.length) {
      state = dishesData.map(() => ({ jai: false, niki: false, kook: false }));
    }

    let activeFilter = 'all';

    function saveState() {
      localStorage.setItem('hamazushi_split_state', JSON.stringify(state));
    }

    function togglePerson(idx, person) {
      state[idx][person] = !state[idx][person];
      saveState();
      updateView();
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = 'filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      });
      const activeBtn = document.getElementById(`btn-filter-${filter}`);
      if (activeBtn) {
        activeBtn.className = 'filter-btn px-2.5 py-1 rounded-lg font-medium bg-slate-900 text-white transition';
      }
      renderDishes();
    }

    function resetAll() {
      if (confirm('ต้องการล้างการติ๊กเลือกทั้งหมดหรือไม่?')) {
        state = dishesData.map(() => ({ jai: false, niki: false, kook: false }));
        saveState();
        updateView();
      }
    }

    function splitAllEqually() {
      state = dishesData.map(() => ({ jai: true, niki: true, kook: true }));
      saveState();
      updateView();
    }

    function renderDishes() {
      const container = document.getElementById('dishes-container');
      container.innerHTML = '';

      let unassignedCount = 0;

      dishesData.forEach((dish, idx) => {
        const sel = state[idx];
        const count = (sel.jai ? 1 : 0) + (sel.niki ? 1 : 0) + (sel.kook ? 1 : 0);
        if (count === 0) unassignedCount++;

        // Apply filter
        let show = true;
        if (activeFilter === 'unassigned' && count > 0) show = false;
        else if (activeFilter === '30' && dish.price !== 30) show = false;
        else if (activeFilter === '40' && dish.price !== 40) show = false;
        else if (activeFilter === '60' && dish.price !== 60) show = false;
        else if (activeFilter === '80-100' && dish.price < 80) show = false;

        if (!show) return;

        const perPerson = count > 0 ? (dish.price / count).toFixed(1) : 0;

        let statusBadge = '';
        if (count === 0) {
          statusBadge = '<span class="text-[11px] px-2 py-0.5 rounded-md font-semibold bg-amber-100 text-amber-800">⚠️ ยังไม่เลือก</span>';
        } else if (count === 1) {
          statusBadge = `<span class="text-[11px] px-2 py-0.5 rounded-md font-semibold bg-blue-100 text-blue-800">คนเดียว ฿${dish.price}</span>`;
        } else {
          statusBadge = `<span class="text-[11px] px-2 py-0.5 rounded-md font-semibold bg-emerald-100 text-emerald-800">หาร ${count} คนละ ฿${perPerson}</span>`;
        }

        const card = document.createElement('div');
        card.className = `bg-white border ${count === 0 ? 'border-amber-200 bg-amber-50/20' : 'border-slate-200'} rounded-2xl p-3 shadow-xs transition-all hover:shadow-md flex flex-col sm:flex-row items-center gap-3`;

        card.innerHTML = `
          <!-- Image -->
          <div class="w-full sm:w-28 h-24 sm:h-20 flex-shrink-0 overflow-hidden rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center">

          <!-- Info & Name -->

              </div>
              <div class="text-right flex-shrink-0">

            </div>

            <!-- Person Selector Pills & Status -->
            <div class="mt-2.5 flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
              <div class="flex items-center gap-1.5">
                <!-- Jai Pill -->
                <button type="button" onclick="togglePerson(${idx}, 'jai')" class="px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1 active:scale-95 ${sel.jai ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  <span>${sel.jai ? '✓' : '+'}</span> Jai
                </button>

                <!-- Niki Pill -->
                <button type="button" onclick="togglePerson(${idx}, 'niki')" class="px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1 active:scale-95 ${sel.niki ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">

                <!-- P'Kook Pill -->
                <button type="button" onclick="togglePerson(${idx}, 'kook')" class="px-3 py-1 rounded-full text-xs font-bold transition flex items-center gap-1 active:scale-95 ${sel.kook ? 'bg-rose-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  <span>${sel.kook ? '✓' : '+'}</span> P'Kook
                </button>
              </div>

              <div>
                ${statusBadge}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      const unassignedEl = document.getElementById('unassigned-count');
      if (unassignedEl) unassignedEl.textContent = unassignedCount;
    }

    function updateTotals() {
      let sumJai = 0, sumNiki = 0, sumKook = 0;
      let cntJai = 0, cntNiki = 0, cntKook = 0;
      let totalAllocated = 0;

      state.forEach((sel, idx) => {
        const count = (sel.jai ? 1 : 0) + (sel.niki ? 1 : 0) + (sel.kook ? 1 : 0);
        if (count > 0) {
          const splitPrice = dishesData[idx].price / count;
          totalAllocated += dishesData[idx].price;

          if (sel.jai) { sumJai += splitPrice; cntJai++; }
          if (sel.niki) { sumNiki += splitPrice; cntNiki++; }
          if (sel.kook) { sumKook += splitPrice; cntKook++; }
        }
      });

      document.getElementById('sum-jai').textContent = `฿${sumJai.toFixed(1)}`;
      document.getElementById('cnt-jai').textContent = `${cntJai} จาน`;

      document.getElementById('sum-niki').textContent = `฿${sumNiki.toFixed(1)}`;
      document.getElementById('cnt-niki').textContent = `${cntNiki} จาน`;

      document.getElementById('sum-kook').textContent = `฿${sumKook.toFixed(1)}`;
      document.getElementById('cnt-kook').textContent = `${cntKook} จาน`;

      document.getElementById('footer-allocated').textContent = `฿${Math.round(totalAllocated)}`;

      const badge = document.getElementById('header-status-badge');
      const text = document.getElementById('header-status-text');

      if (totalAllocated === 1170) {
        badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800';
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> <span>ครบ ฿1,170 พอดีเป๊ะ! 🎉</span>';
      } else {
        const diff = 1170 - Math.round(totalAllocated);
        badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> <span>ยังขาดอีก ฿${diff}</span>`;
      }
    }

    function updateView() {
      updateTotals();
      renderDishes();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      msgEl.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function copySummaryToLine() {
      const jai = document.getElementById('sum-jai').textContent;
      const niki = document.getElementById('sum-niki').textContent;
      const kook = document.getElementById('sum-kook').textContent;
      const allocated = document.getElementById('footer-allocated').textContent;

      let msg = `🍣 สรุปยอดหารค่าอาหาร Hamazushi\nยอดรวมบิลทั้งหมด: 1,170 บาท (25 จาน)\n--------------------------------\n`;
      msg += `👤 Jai: ${jai}\n`;
      msg += `👤 Niki: ${niki}\n`;
      msg += `👤 P'Kook: ${kook}\n`;
      msg += `--------------------------------\n`;
      if (allocated === '฿1,170') {
        msg += `✅ ยอดรวมตรงครบ 1,170 บาทพอดีเป๊ะครับ!`;
      } else {
        msg += `⚠️ ยอดที่ระบุตอนนี้: ${allocated} (ยังเหลือจานที่ยังไม่ได้เลือก)`;
      }

      navigator.clipboard.writeText(msg).then(() => {
        showToast('📋 คัดลอกสรุปยอดสำหรับส่ง LINE แล้ว!');
      }).catch(() => {
        prompt('ก๊อปปี้ข้อความสรุปยอดด้านล่างนี้ได้เลยครับ:', msg);
      });
    }

    // Initial render
    updateView();
  </script>
</body>
</html>
